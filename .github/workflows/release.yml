name: Release Python bindings

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    build:
        if: startsWith(github.event.release.tag_name, 'v')
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
                  submodules: recursive
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Build distributions
              run: |
                  python -m pip install --upgrade build
                  python -m build python
            - name: Verify release version
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  python - <<'PY'
                  import pathlib
                  import tomllib
                  import os

                  expected = os.environ["RELEASE_TAG"].removeprefix("v")
                  with pathlib.Path("python/pyproject.toml").open("rb") as stream:
                      actual = tomllib.load(stream)["project"]["version"]
                  if actual != expected:
                      raise SystemExit(
                          f"release tag {expected!r} does not match Python version {actual!r}"
                      )
                  PY
            - name: Test wheel in a clean environment
              run: |
                  python -m venv "${RUNNER_TEMP}/wheel-test"
                  "${RUNNER_TEMP}/wheel-test/bin/python" -m pip install python/dist/*.whl
                  "${RUNNER_TEMP}/wheel-test/bin/python" -c \
                    "import myelin; assert myelin.__version__ == '${{ github.event.release.tag_name }}'[1:]"
                  python - <<'PY'
                  from pathlib import Path
                  from zipfile import ZipFile

                  wheel = next(Path("python/dist").glob("*.whl"))
                  with ZipFile(wheel) as archive:
                      assert any(name.endswith("/licenses/LICENSE") for name in archive.namelist())
                  PY
            - uses: actions/upload-artifact@v4
              with:
                  name: myelin-runtime-${{ github.event.release.tag_name }}
                  path: python/dist/*
                  if-no-files-found: error
            - uses: actions/attest-build-provenance@v2
              with:
                  subject-path: python/dist/*

    publish:
        needs: build
        runs-on: ubuntu-24.04
        environment:
            name: pypi
            url: https://pypi.org/project/myelin-runtime/
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: myelin-runtime-${{ github.event.release.tag_name }}
                  path: dist
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/
